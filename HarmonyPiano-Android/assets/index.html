<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>和声小钢琴</title><link rel="stylesheet" href="piano.css"><link rel="stylesheet" href="themes.css"></head><body data-theme="garden">
<header><div class="brand">♮ 和声小钢琴 <small>中央 C = C4</small></div><div class="toolbar"><select id="theme" aria-label="选择钢琴主题"><option value="garden">晴日花园</option><option value="monet">莫奈池塘</option><option value="mist">雾中微光</option></select><button id="chordToggle" aria-expanded="false" aria-controls="chordPanel">和弦查询 ⌄</button><button id="intervalHelp">音程速查</button><button id="singHelp">弹唱提示</button><button id="sustain" aria-pressed="false">延音 · 关</button><label>松键后 <input id="seconds" type="number" min="0.2" max="10" step="0.1" value="1.5" aria-label="延音秒数"> 秒</label><button id="panic">全部止音</button></div></header>
<section id="chordPanel" hidden aria-label="和弦查询"><div class="searchbar"><label>根音 <select id="root" aria-label="和弦根音"></select></label><input id="search" type="search" autocomplete="off" placeholder="名称或符号：小七 / add9 / F#m7" aria-label="搜索和弦"><select id="group" aria-label="和弦分类"><option value="all">全部和弦</option><option value="triad">三和弦</option><option value="seventh">七和弦</option><option value="sus">挂留</option><option value="extended">扩展</option><option value="added">加音</option></select><span id="count"></span></div><div id="results" aria-label="和弦搜索结果"></div></section>
<div class="referencebar"><div id="summary" role="status">自由弹奏 · 需要时展开和弦查询</div><div><button id="hear" disabled>▶ 齐奏</button><button id="arp" disabled>♪ 逐音</button><button id="clear" disabled>清除标记</button></div></div>
<details id="chordDetails" hidden><summary>构成与音程 <span id="formula"></span></summary><div id="tones"></div><p id="explanation"></p></details>
<main><div class="keyboard-tools"><span id="range"></span><div><label>键盘模式 <select id="keyboardMode" aria-label="键盘模式"><option value="49" selected>49 键</option><option value="88">88 键</option></select></label><button id="down" aria-label="降低八度">− 八度</button><label>琴键宽度 <select id="octaves"><option value="4">常用宽键</option><option value="3">约三八度</option><option value="2">约两八度</option><option value="1">约一八度</option><option value="all">全部 49 键</option></select></label><button id="up" aria-label="升高八度">＋ 八度</button></div></div><div class="keyboard-scrollbar"><span>低音</span><input id="keyboardScroll" type="range" min="0" max="1" value="0" step="1" aria-label="横向移动琴键"><span>高音</span><small id="scrollHint">拖动滑条查看两端琴键</small></div><div id="keyboard" aria-label="多指演奏钢琴"></div><div class="feedback"><span id="status" role="status">按下发声，松开释音</span><span>暖色：根音　绿色：和弦参考音　描边：正在按下</span></div></main>
<footer><span>C3 低音 · C4 中央 C · C5 高八度　/　横屏弹奏更舒适</span><span>合成音色 · 离线使用 · 延音为松键后的淡出时长</span></footer>
<dialog id="guide" aria-labelledby="guideTitle"><div class="dialog-heading"><h2 id="guideTitle"></h2><button id="closeGuide" aria-label="关闭说明">关闭 ×</button></div><div id="guideBody"></div></dialog>
<script src="chord-data.js"></script><script src="piano-release.js"></script><script src="piano-guide.js"></script><script src="piano.js"></script></body></html>
